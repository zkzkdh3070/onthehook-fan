<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>온더훅 (팬게임)</title>
<style>
:root{--teal:#4ac9c4;--teal2:#6dd3d0;--bg:#f7f7f7;--line:#eee;--txt:#222;--sub:#999;--bub:#f2f2f2;--red:#f01010;--yel:#e8ff3a;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#2a2e33;--line:#3a3f45;--txt:#eee;--sub:#8a9199;--bub:#3b4046}body,#app{background:#1f2327}}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font-family:"Gaegu","Jua","Noto Sans KR","Malgun Gothic",sans-serif;color:var(--txt);background:#ddd;display:flex;justify-content:center}
#app{width:100%;max-width:480px;height:100dvh;background:#fff;display:flex;flex-direction:column;overflow:hidden}
header{background:var(--teal);color:#fff;height:64px;padding:env(safe-area-inset-top) 18px 0;box-sizing:content-box;display:flex;align-items:center;gap:12px;font-size:22px;flex:none}
header .n{color:var(--yel);margin-left:6px}
header .sp{flex:1}
header button{background:none;border:0;color:#fff;cursor:pointer;padding:6px;display:flex}
header button:focus-visible,.tab:focus-visible,.row:focus-visible,.add:focus-visible{outline:3px solid #fff8;outline-offset:2px}
.back{font-size:30px;line-height:1}
nav{display:flex;background:var(--bg);flex:none}
.tab{flex:1;height:56px;border:0;background:none;position:relative;cursor:pointer;border-bottom:3px solid transparent;display:flex;align-items:center;justify-content:center}
.tab.on{border-color:var(--teal)}
.badge{position:absolute;top:26px;left:calc(50% + 6px);min-width:24px;height:24px;border-radius:12px;background:var(--red);color:#fff;font-size:13px;display:flex;align-items:center;justify-content:center;padding:0 6px}
main{flex:1;overflow-y:auto;overscroll-behavior:contain}
.sec{color:var(--teal);font-size:17px;padding:16px 14px 6px;margin:0 12px;border-bottom:2px solid var(--line)}
.row{display:flex;align-items:center;gap:14px;padding:10px 14px;margin:0 12px;border:0;border-bottom:2px solid var(--line);background:none;width:calc(100% - 24px);text-align:left;font:inherit;color:inherit;cursor:pointer;min-height:76px}
.row:last-child{border-bottom:0}
.av{width:56px;height:56px;border-radius:50%;flex:none;background:var(--teal) center/cover;display:flex;align-items:center;justify-content:center}
.nm{font-size:20px}
.mid{flex:1;min-width:0}
.pv{color:var(--sub);font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st{background:var(--bub);border-radius:18px 18px 18px 4px;padding:8px 16px;font-size:15px;max-width:55%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.st:empty{display:none}
.cnt{background:var(--red);color:#fff;min-width:30px;height:30px;border-radius:15px;display:flex;align-items:center;justify-content:center;font-size:15px}
.add{width:56px;height:46px;border-radius:10px;border:3px solid var(--line);background:none;cursor:pointer;display:flex;align-items:center;justify-content:center}
.add:disabled{opacity:.4}
.empty{color:var(--sub);text-align:center;padding:60px 20px;font-size:17px}
.mail{padding:14px 26px;border-bottom:2px solid var(--line);cursor:pointer}
.mail b{font-weight:400;font-size:19px}.mail.un b::after{content:" ●";color:var(--red);font-size:12px}
.mail p{color:var(--sub);margin-top:6px;display:none;font-size:16px}.mail.open p{display:block}
#chat{padding:12px 14px 20px}
.m{display:flex;gap:10px;padding-top:14px;align-items:flex-start}
.m.cont{padding-top:6px}
.m.cont .bb,.m.me.cont .bb{border-radius:16px}
.m.me{justify-content:flex-end}
.m .av{width:46px;height:46px}
.m .who{font-size:15px;margin-bottom:3px}
.bb{background:var(--bub);border-radius:4px 16px 16px 16px;padding:10px 16px;font-size:19px;word-break:break-word;max-width:100%}
.m.me .bb{background:var(--teal2);color:#fff;border-radius:16px 4px 16px 16px}
.m>div{max-width:72%}
form{display:flex;gap:10px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));flex:none}
form input{flex:1;min-width:0;height:48px;border:3px solid var(--line);border-radius:8px;padding:0 12px;font:inherit;font-size:18px;background:transparent;color:inherit}
form input:focus{outline:2px solid var(--teal);border-color:transparent}
form button{height:48px;padding:0 20px;border:0;border-radius:8px;background:var(--teal);color:#fff;font:inherit;font-size:19px;cursor:pointer}
#choices{display:flex;flex-direction:column;gap:8px;padding:10px 12px calc(12px + env(safe-area-inset-bottom));flex:none;border-top:2px solid var(--line)}#choices[hidden]{display:none}.ch{border:3px solid var(--teal);background:transparent;color:var(--txt);border-radius:12px;padding:12px 16px;font:inherit;font-size:19px;cursor:pointer;text-align:left}.ch:hover,.ch:focus-visible{background:var(--teal);color:#fff;outline:0}

.profile-overlay{position:fixed;inset:0;background:#0006;display:flex;align-items:center;justify-content:center;padding:18px;z-index:20}
.profile-overlay[hidden]{display:none}
.profile-modal{position:relative;background:#fff;color:#222;width:100%;max-width:360px;border-radius:34px;padding:28px 24px 24px;text-align:center;box-shadow:0 8px 32px #0002}
.profile-close{position:absolute;right:18px;top:12px;border:0;background:none;color:#777;font-size:34px;cursor:pointer}
.profile-avatar{width:100px;height:100px;border-radius:50%;margin:18px auto 22px;background:#d8f7f5;display:flex;align-items:center;justify-content:center}
.profile-modal label{display:block;text-align:left;color:#777;font-size:13px;margin:12px 4px 5px}
.profile-modal input{width:100%;height:44px;border:2px solid #e5e5e5;border-radius:8px;padding:0 12px;font:inherit;font-size:17px;color:#222;background:#fff}
.profile-actions{display:flex;gap:10px;margin-top:22px}
.profile-actions button{flex:1;border:0;border-radius:9px;padding:12px 8px;font:inherit;font-size:16px;cursor:pointer}
.profile-cancel{background:#eee;color:#555}.profile-save{background:var(--teal);color:#fff}

#splash{position:fixed;inset:0;background:#4ac9c4;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;color:#fff;font:400 28px "Noto Sans KR","Malgun Gothic",sans-serif;transition:opacity .4s}#splash.out{opacity:0}
.fr .av.big{width:112px;height:112px;margin:24px auto 18px}
.fr h2{font-size:24px;font-weight:400;margin:0 0 6px}
.fr .fst{color:#888;min-height:44px;font-size:16px}
.fr hr{border:0;border-top:2px solid #e5e5e5;margin:14px 0 18px}
.fr .acts{display:flex;gap:10px}
.fr .acts button{flex:1;height:68px;border:2px solid #e5e5e5;border-radius:8px;background:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center}
.fr .acts button:focus-visible{outline:3px solid var(--teal)}
.profile-modal.fr{min-height:470px}.fr .gauge{margin:96px auto 0;display:block}
.fr .ttl{font-size:21px;margin:26px 0 8px}
.dv{border-top:2px solid var(--line);margin:22px 0 4px;text-align:center}.dv span{display:block;padding-top:6px;color:var(--sub);font-size:14px}
@media (prefers-reduced-motion:no-preference){.m{animation:pop .18s ease-out}@keyframes pop{from{opacity:0;transform:translateY(6px)}}}
</style>
</head>
<body>
<div id="app">
  <header id="hd"></header>
  <nav id="nav" role="tablist"></nav>
  <main id="main"></main>
  <div id="choices" hidden></div>
  <div id="profileOverlay" class="profile-overlay" hidden>
    <section class="profile-modal" role="dialog" aria-modal="true" aria-labelledby="profileTitle">
      <button id="profileClose" class="profile-close" aria-label="닫기">×</button>
      <div class="profile-avatar" id="profileAvatar"></div>
      <h2 id="profileTitle" style="font-size:23px;font-weight:500">내 프로필</h2>
      <label for="profileName">이름</label>
      <input id="profileName" maxlength="30" autocomplete="off">
      <label for="profileStatus">상태 메시지</label>
      <input id="profileStatus" maxlength="80" autocomplete="off" placeholder="상태 메시지를 입력하세요">
      <div class="profile-actions">
        <button id="profileCancel" class="profile-cancel">취소</button>
        <button id="profileSave" class="profile-save">저장</button>
      </div>
    </section>
  </div>
</div>
<div id="friendOverlay" class="profile-overlay" hidden>
  <section class="profile-modal fr" role="dialog" aria-modal="true" aria-label="친구 프로필">
    <button id="frClose" class="profile-close" aria-label="닫기">×</button>
    <div id="frBody"></div>
  </section>
</div>
<div id="splash"><svg width="220" height="154" viewBox="0 0 40 28" fill="#fff"><path d="M3 14C9 4 21 3 28 12L38 6v16l-10-6C21 25 9 24 3 14z"/><circle cx="11" cy="12.2" r="1.5" fill="#4ac9c4"/></svg><div>ON THE HOOK</div></div>
<script>function showErr(m){const e=document.getElementById("main");if(e)e.innerHTML='<div style="padding:20px;color:#d33;font:16px sans-serif;white-space:pre-wrap;word-break:break-all"></div>',e.firstChild.textContent="⚠ 오류가 났어요. 이 글을 캡처해서 보내 주세요.\n\n"+m}
addEventListener("error",ev=>showErr(ev.message+" ("+String(ev.filename||"").split("/").pop()+":"+ev.lineno+")"));
const T0=Date.now();function hideSplash(){setTimeout(()=>{const s=document.getElementById("splash");if(!s)return;s.classList.add("out");setTimeout(()=>s.remove(),400)},Math.max(0,2000-(Date.now()-T0)))}</script>
<script src="data.js"></script>
<script>
(async () => {
if (!window.GAME_DATA) throw new Error("data.js를 읽지 못했어요. 파일 이름·위치 또는 문법 오류(쉼표, 따옴표)를 확인하세요.");
const D = window.GAME_DATA, KEY = "onhook_v" + D.version;
const loadErrs = [];
await Promise.all([...D.characters, ...D.recommended].filter(c => c.scriptFile).map(async c => {
  try { const r = await fetch(c.scriptFile, { cache: "no-cache" }); if (!r.ok) throw new Error(r.status); c.script = parseScript(await r.text()); }
  catch (e) { loadErrs.push(c.scriptFile); console.warn("스크립트 로드 실패:", c.scriptFile, e); }
}));
const $ = s => document.querySelector(s);
const all = [...D.characters, ...D.recommended];
const byId = id => all.find(c => c.id === id);

/* ---------- TXT 스크립트 해석 ---------- */
function parseScript(txt) {
  const nodes = {}, top = []; let cur = null, curId = null, topId = null, owner = null, mode = null, start = null;
  const open = (id, isTop) => { cur = nodes[id] = { lines: [] }; curId = id; mode = null; if (isTop) { top.push(id); topId = id; start = start || id; } cur.top = topId; };
  for (const raw of txt.replace(/\r/g, "").split("\n")) {
    const l = raw.trim(); if (!l || l[0] === "#") continue;
    let m, x;
    if ((m = l.match(/^\[(.+)\]$/))) {
      const t = m[1].trim();
      if ((x = t.match(/^장면\s*[:：]?\s*(.+)$/))) open(x[1].trim(), true);
      else if (!cur) continue;
      else if (t === "선택지") { cur.choices = cur.choices || []; owner = curId; mode = "choice"; }
      else if ((x = t.match(/^(\d+)\s*번\s*선택$/))) open(owner + "_" + x[1], false);
      else if ((x = t.match(/^이동\s*[:：]?\s*(.+)$/))) cur.next = x[1].trim();
      else if (t === "끝") cur.end = true;
      else if ((x = t.match(/^구분선\s*[:：]?\s*(.*)$/))) cur.lines.push(["line", x[1]]);
      continue;
    }
    if (!cur) open("start", true);
    if (mode === "choice" && (m = l.match(/^(\d+)\s*[.)]\s*(.+)$/))) { nodes[owner].choices.push({ text: m[2], next: owner + "_" + m[1] }); continue; }
    if ((m = l.match(/^([^:：]{1,20})[:：]\s*(.*)$/))) cur.lines.push([/^(주인공|나|me)$/i.test(m[1].trim()) ? "me" : "them", m[2]]);
    else if (cur.lines.length) cur.lines.push([cur.lines[cur.lines.length - 1][0], l]);
  }
  for (const id in nodes) {
    const n = nodes[id];
    if (n.choices && !n.choices.length) delete n.choices;
    if (!n.choices && !n.next && !n.end) { const nx = top[top.indexOf(n.top) + 1]; if (nx) n.next = nx; }
    (n.choices || []).forEach(c => { const b = nodes[c.next]; if (b && b.lines[0] && b.lines[0][0] === "me") c.silent = true; });
  }
  return { start, nodes };
}

/* ---------- 저장 상태 ---------- */
let S = null;
try { S = JSON.parse(localStorage.getItem(KEY)); } catch (e) {}
if (!S) { S = { added: [], chats: {}, unread: {}, pos: {}, mail: D.mail.map(m => !!m.read), me: { ...D.me } }; D.characters.forEach(ensure); }
if (!S.me) S.me = { ...D.me };
/* 예전에 스크립트 로드가 실패해 저장된 빈 상태를 자동 복구 */
D.characters.concat(D.recommended.filter(r => S.added.includes(r.id))).forEach(c => {
  const n = c.script && c.script.nodes[c.script.start], p = S.pos[c.id];
  if (!n || (p && p.node && c.script.nodes[p.node])) return;
  S.pos[c.id] = { node: c.script.start, k: 0 };
  if (!(S.chats[c.id] || []).length) S.unread[c.id] = lead(n);
  save();
});
function ensure(c) {
  const sc = c.script, n = sc && sc.nodes[sc.start];
  S.chats[c.id] = (c.history || []).map(x => x.slice());
  S.pos[c.id] = { node: sc && sc.start, k: 0 };
  S.unread[c.id] = c.unread != null ? c.unread : n ? lead(n) : 0;
}
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }

/* ---------- 아이콘 ---------- */
const fish = (c, w = 40, plus) => `<svg width="${w}" height="${w * .7}" viewBox="0 0 40 28" fill="${c}"><path d="M3 14C9 4 21 3 28 12L38 6v16l-10-6C21 25 9 24 3 14z"/>${plus ? `<path d="M33 1v8M29 5h8" stroke="${c}" stroke-width="2.4" fill="none"/>` : ""}</svg>`;
const hook = c => `<svg width="30" height="40" viewBox="0 0 30 40" fill="none" stroke="${c}" stroke-width="4.5" stroke-linecap="round"><path d="M10 4v20a8 8 0 0 0 16 0v-3"/></svg>`;
const mail = c => `<svg width="44" height="32" viewBox="0 0 44 32"><rect width="44" height="30" rx="5" fill="${c}"/><path d="M4 8l18 12L40 8" stroke="#fff" stroke-width="3" fill="none"/></svg>`;
const gear = `<svg width="34" height="34" viewBox="0 0 24 24" fill="#fff"><path d="M19.4 13a7.5 7.5 0 0 0 0-2l2.1-1.6-2-3.5-2.5 1a7.4 7.4 0 0 0-1.7-1L15 3.2h-4l-.4 2.7a7.4 7.4 0 0 0-1.7 1l-2.5-1-2 3.5L6.600 11a7.500 7.500 0 0 0 0 2l-2.100 1.600 2 3.500 2.500-1c.5.400 1.100.700 1.700 1l.400 2.700h4l.4-2.700c.6-.3 1.200-.6 1.700-1l2.500 1 2-3.500zM13 15.500a3.500 3.500 0 1 1 0-7 3.500 3.500 0 0 1 0 7z"/></svg>`;

/* ---------- 데이터 계산 ---------- */
const friends = () => [...D.characters, ...D.recommended.filter(r => S.added.includes(r.id)).map(r => ({ ...r, group: r.addAs || "guest", status: r.status || "" }))];
const lastOf = id => (S.chats[id] || []).filter(m => m[0] !== "line").slice(-1)[0];
const chatList = () => friends().filter(c => (S.chats[c.id] || []).length || S.unread[c.id]);
const previewOf = c => { const n = c.script && c.script.nodes[c.script.start]; const s = n && stepsOf(n)[0]; return s ? s[1] : ""; };
const unreadTotal = () => Object.values(S.unread).reduce((a, b) => a + b, 0);
const recs = () => D.recommended.filter(r => !S.added.includes(r.id));

/* ---------- 화면 ---------- */
let tab = 0, room = null, timers = [];
const el = (t, cls, txt) => { const e = document.createElement(t); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; };
const avatar = c => { const a = el("div", "av"); if (c.avatar) a.style.backgroundImage = `url("${c.avatar}")`; else a.innerHTML = fish("#fff", 30); return a; };

function render() {
  const hd = $("#hd"), nav = $("#nav"), main = $("#main");
  hd.innerHTML = ""; main.innerHTML = "";
  if (room) {
    nav.hidden = false;
    const b = el("button", "back", "‹"); b.setAttribute("aria-label", "뒤로"); b.onclick = closeRoom;
    hd.append(b, el("span", "", room.name));
    const roomTabs = ["친구", "대화", "추천", "쪽지"];
    nav.innerHTML = "";
    roomTabs.forEach((name, i) => {
      const t = el("button", "tab" + (i === tab ? " on" : ""));
      t.setAttribute("role", "tab"); t.setAttribute("aria-label", name);
      t.innerHTML = ([
        on => fish(on ? "#4ac9c4" : "#ccc", 50),
        on => hook(on ? "#4ac9c4" : "#ccc"),
        on => fish(on ? "#4ac9c4" : "#ccc", 46, 1),
        on => mail("#ccc")
      ][i])(i === tab);
      t.onclick = () => { room = null; tab = i; $("#choices").hidden = true; render(); };
      nav.append(t);
    });
    const c = el("div"); c.id = "chat"; main.append(c);
    (S.chats[room.id] || []).forEach((m, i, arr) => c.append(bubble(room, m, arr[i - 1])));
    main.scrollTop = main.scrollHeight; showChoices();
    return;
  }
  nav.hidden = false; $("#choices").hidden = true;
  const titles = [["친구", friends().length], ["대화", chatList().length], ["추천", recs().length], ["쪽지", D.mail.length]];
  hd.innerHTML = `<span>${titles[tab][0]}<span class="n">${titles[tab][1]}</span></span><span class="sp"></span>`;
  const g = el("button"); g.innerHTML = gear; g.setAttribute("aria-label", "설정: 진행 초기화"); g.onclick = () => { if (confirm("대화 기록과 친구 추가를 모두 초기화할까요?")) { localStorage.removeItem(KEY); location.reload(); } };
  hd.append(g);
  const badges = [0, unreadTotal(), recs().length, S.mail.filter(r => !r).length];
  const icons = [on => fish(on ? "#4ac9c4" : "#ccc", 50), on => hook(on ? "#4ac9c4" : "#ccc"), on => fish(on ? "#4ac9c4" : "#ccc", 46, 1), on => mail("#ccc")];
  nav.innerHTML = "";
  ["친구", "대화", "추천", "쪽지"].forEach((n, i) => {
    const t = el("button", "tab" + (i === tab ? " on" : "")); t.setAttribute("role", "tab"); t.setAttribute("aria-label", n);
    t.innerHTML = icons[i](i === tab) + (badges[i] ? `<span class="badge">${badges[i]}</span>` : "");
    t.onclick = () => { tab = i; render(); }; nav.append(t);
  });
  if (loadErrs.length) { const e = el("div", "sec", "⚠ 스크립트 파일을 불러오지 못했어요: " + loadErrs.join(", ")); e.style.color = "#d33"; main.append(e); }
  [viewFriends, viewChats, viewRecs, viewMail][tab](main);
}

function viewFriends(m) {
  m.append(el("div", "sec", "내 프로필"));
  const me = el("button", "row"); me.type = "button"; me.setAttribute("aria-label", "내 프로필 수정");
  me.append(avatar(S.me), el("div", "nm mid", S.me.name || "시윤"), el("div", "st", S.me.status || ""));
  me.onclick = openProfileEditor; m.append(me);
  const f = friends();
  [["fav", "즐겨찾기", 12], ["guest", "게스트", 5]].forEach(([k, label, max]) => {
    const list = f.filter(c => c.group === k);
    m.append(el("div", "sec", `${label}(${list.length}/${max})`));
    list.forEach(c => { const r = el("button", "row"); r.append(avatar(c), el("div", "nm mid", c.name), el("div", "st", c.status || "")); r.onclick = () => openFriend(c); m.append(r); });
  });
}

function viewChats(m) {
  const l = chatList();
  if (!l.length) return m.append(el("div", "empty", "아직 대화가 없어요. 친구를 눌러 말을 걸어보세요."));
  l.forEach(c => {
    const r = el("button", "row"), mid = el("div", "mid");
    mid.append(el("div", "nm", c.name), el("div", "pv", displayText((lastOf(c.id) || ["", previewOf(c)])[1])));
    r.append(avatar(c), mid); if (S.unread[c.id]) r.append(el("div", "cnt", S.unread[c.id]));
    r.onclick = () => openRoom(c); m.append(r);
  });
}

function viewRecs(m) {
  m.append(el("div", "sec", "추천친구"));
  const l = recs(); if (!l.length) return m.append(el("div", "empty", "추천할 친구가 더 없어요."));
  l.forEach(c => {
    const r = el("div", "row"), b = el("button", "add"); b.innerHTML = fish("#aaa", 34, 1); b.setAttribute("aria-label", c.name + " 친구 추가");
    b.onclick = () => { S.added.push(c.id); ensure(c); save(); render(); };
    r.append(avatar(c), el("div", "nm mid", c.name), b); m.append(r);
  });
}

function viewMail(m) {
  D.mail.forEach((x, i) => {
    const d = el("div", "mail" + (S.mail[i] ? "" : " un")); d.append(el("b", "", x.from), el("p", "", x.text));
    d.onclick = () => { d.classList.toggle("open"); if (!S.mail[i]) { S.mail[i] = true; save(); d.classList.remove("un"); } };
    m.append(d);
  });
}

/* ---------- 채팅방 ---------- */
function displayText(text) {
  const currentName = (S.me && S.me.name || D.me.name || "주인공").trim();
  return String(text).replace(/\{주인공이름\}/g, currentName);
}
function bubble(c, [who, text], prev) {
  if (who === "line") { const d = el("div", "dv"); if (text) d.append(el("span", "", displayText(text))); return d; }
  const cont = !!prev && prev[0] === who, t = displayText(text);
  const w = el("div", "m " + who + (cont ? " cont" : ""));
  if (who === "me") { const b = el("div"); b.append(el("div", "bb", t)); w.append(b); return w; }
  const box = el("div"); if (!cont) box.append(el("div", "who", c.name)); box.append(el("div", "bb", t));
  if (cont) { const sp = el("div", "av"); sp.style.visibility = "hidden"; w.append(sp); } else w.append(avatar(c));
  w.append(box); return w;
}
const running = {};
const nodeOf = c => c.script && c.script.nodes[S.pos[c.id].node];
function stepsOf(n) { return n.lines || [...(n.them || []).map(t => ["them", t]), ...(n.auto ? [["me", n.auto]] : [])]; }
function lead(n) { let k = 0; for (const s of stepsOf(n)) { if (s[0] !== "them") break; k++; } return k; }
function push(c, who, text) {
  const prev = (S.chats[c.id] || []).slice(-1)[0];
  (S.chats[c.id] = S.chats[c.id] || []).push([who, text]);
  if (who === "them" && !(room && room.id === c.id)) S.unread[c.id] = (S.unread[c.id] || 0) + 1;
  save();
  if (room && room.id === c.id) { $("#chat").append(bubble(c, [who, text], prev)); $("#main").scrollTop = $("#main").scrollHeight; }
}
function play(c) {
  const p = S.pos[c.id], n = nodeOf(c);
  if (!n || running[c.id]) return;
  const steps = stepsOf(n); running[c.id] = true;
  (function step() {
    if (p.k < steps.length) {
      setTimeout(() => { push(c, steps[p.k][0], steps[p.k][1]); p.k++; save(); step(); }, steps[p.k][0] === "me" ? 900 : steps[p.k][0] === "line" ? 400 : 800);
    } else { running[c.id] = false; if (n.choices) showChoices(); else if (n.next) go(c, n.next); }
  })();
}
function go(c, id) { S.pos[c.id] = { node: id, k: 0 }; save(); play(c); }
function showChoices() {
  const box = $("#choices"); box.innerHTML = ""; box.hidden = true;
  if (!room || running[room.id]) return;
  const n = nodeOf(room); if (!n || !n.choices || S.pos[room.id].k < stepsOf(n).length) return;
  const c = room;
  n.choices.forEach(ch => { const b = el("button", "ch", ch.text); b.onclick = () => { box.hidden = true; if (!ch.silent) push(c, "me", ch.say || ch.text); go(c, ch.next); }; box.append(b); });
  box.hidden = false; $("#main").scrollTop = $("#main").scrollHeight;
}
function openRoom(c) {
  if (c.id !== "hansegye") {
    alert("이 팬게임에서 공략할 수 있는 캐릭터는 한세계뿐이에요.");
    return;
  }
  room = c; S.unread[c.id] = 0; save(); render(); play(c);
}
function closeRoom() { room = null; $("#choices").hidden = true; render(); }

function openFriend(c, info) {
  const b = $("#frBody"); b.innerHTML = "";
  if (info) {
    const a = Object.assign({ level: 25, title: "스레기의 그녀" }, D.affinityDefault, c.affinity), y = 40 * (1 - Math.max(0, Math.min(100, a.level)) / 100);
    const P = "M0 19.600C10 6 28 0 43 0C58 0 72 8 82 15L100 6.800Q94 19.600 100 32.700L82 24C72 32 58 40 43 40C28 40 10 33 0 19.600Z";
    b.innerHTML = `<svg class="gauge" width="190" height="76" viewBox="0 0 100 40" role="img" aria-label="호감도"><defs><clipPath id="fc"><rect x="0" y="${y}" width="100" height="40"/></clipPath></defs><path d="${P}" fill="#ccc"/><path d="${P}" fill="#55c4b4" clip-path="url(#fc)"/><circle cx="22.7" cy="16.3" r="3.2" fill="#fff"/></svg><hr style="margin-top:100px"><div class="ttl"></div>`;
    b.querySelector(".ttl").textContent = "[" + a.title + "]";
  } else {
    const a = avatar(c); a.classList.add("big"); if (!c.avatar) a.innerHTML = fish("#fff", 60);
    const btn = (label, svg, fn) => { const x = el("button"); x.type = "button"; x.setAttribute("aria-label", label); x.innerHTML = svg; x.onclick = fn; return x; };
    const acts = el("div", "acts");
    acts.append(
      btn("대화하기", '<svg width="64" height="52" viewBox="0 0 64 52"><path d="M6 4h52a4 4 0 0 1 4 4v26a4 4 0 0 1-4 4H34L24 48V38H6a4 4 0 0 1-4-4V8a4 4 0 0 1 4-4z" fill="#4ac9c4"/><g fill="#fff"><circle cx="20" cy="21" r="3.5"/><circle cx="32" cy="21" r="3.5"/><circle cx="44" cy="21" r="3.5"/></g></svg>', () => { closeFriend(); openRoom(c); }),
      btn("정보", '<svg width="52" height="52" viewBox="0 0 52 52"><circle cx="26" cy="26" r="24" fill="#4ac9c4"/><rect x="23" y="22" width="6" height="18" rx="2" fill="#fff"/><circle cx="26" cy="14.500" r="3.500" fill="#fff"/></svg>', () => openFriend(c, true)),
      btn("차단", '<svg width="52" height="52" viewBox="0 0 52 52" fill="none" stroke="#bbb" stroke-width="4.500"><circle cx="26" cy="26" r="22"/><path d="M10 42L42 10"/></svg>', () => alert("차단 기능은 준비 중이에요."))
    );
    b.append(a, el("h2", "", c.name), el("div", "fst", c.status || ""), document.createElement("hr"), acts);
  }
  $("#friendOverlay").hidden = false;
}
function closeFriend() { $("#friendOverlay").hidden = true; }
$("#frClose").onclick = closeFriend;
$("#friendOverlay").addEventListener("click", e => { if (e.target.id === "friendOverlay") closeFriend(); });

function openProfileEditor() {
  $("#profileName").value = S.me.name || "";
  $("#profileStatus").value = S.me.status || "";
  $("#profileOverlay").hidden = false;
  $("#profileName").focus();
}
function closeProfileEditor() { $("#profileOverlay").hidden = true; }
$("#profileClose").onclick = closeProfileEditor;
$("#profileCancel").onclick = closeProfileEditor;
$("#profileOverlay").addEventListener("click", e => { if (e.target.id === "profileOverlay") closeProfileEditor(); });
$("#profileSave").onclick = () => {
  const name = $("#profileName").value.trim();
  if (!name) { alert("이름을 입력해 주세요."); $("#profileName").focus(); return; }
  S.me = { ...S.me, name, status: $("#profileStatus").value.trim() };
  save(); closeProfileEditor(); render();
};
$("#profileStatus").addEventListener("keydown", e => { if (e.key === "Enter") $("#profileSave").click(); });
addEventListener("keydown", e => { if (e.key === "Escape") { closeFriend(); if (!$("#profileOverlay").hidden) closeProfileEditor(); } });
addEventListener("popstate", () => room && closeRoom());
render();
})().catch(e => { console.error(e); showErr(e && e.message || e); }).finally(hideSplash);
</script>
</body>
