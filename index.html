<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>온더훅: 한세계 공략버전</title> /*---사이트 이름---*/
<style>
:root{--teal:#4ac9c4;--teal2:#6dd3d0;--bg:#f7f7f7;--line:#eee;--txt:#222;--sub:#999;--bub:#f2f2f2;--red:#f01010;--yel:#e8ff3a;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#2a2e33;--line:#3a3f45;--txt:#eee;--sub:#8a9199;--bub:#3b4046}body,#app{background:#1f2327}}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font-family:"Gaegu","Jua","Noto Sans KR","Malgun Gothic",sans-serif;color:var(--txt);background:#ddd;display:flex;justify-content:center}
#app{width:100%;max-width:480px;height:100dvh;background:#fff;display:flex;flex-direction:column;overflow:hidden}
header{background:var(--teal);color:#fff;height:64px;padding:env(safe-area-inset-top) 18px 0;box-sizing:content-box;display:flex;align-items:center;gap:12px;font-size:22px;flex:none}
header .n{color:var(--yel);margin-left:6px}
header .sp{flex:1}
header button{background:none;border:0;color:#fff;cursor:pointer;padding:6px;display:flex}
header button:focus-visible,.tab:focus-visible,.row:focus-visible,.add:focus-visible{outline:3px solid #fff8;outline-offset:2px}
.back{font-size:30px;line-height:1}
nav{display:flex;background:var(--bg);flex:none}
.tab{flex:1;height:56px;border:0;background:none;position:relative;cursor:pointer;border-bottom:3px solid transparent;display:flex;align-items:center;justify-content:center}
.tab.on{border-color:var(--teal)}
.badge{position:absolute;top:26px;left:calc(50% + 6px);min-width:24px;height:24px;border-radius:12px;background:var(--red);color:#fff;font-size:13px;display:flex;align-items:center;justify-content:center;padding:0 6px}
main{flex:1;overflow-y:auto;overscroll-behavior:contain}
.sec{color:var(--teal);font-size:17px;padding:16px 14px 6px;margin:0 12px;border-bottom:2px solid var(--line)}
.row{display:flex;align-items:center;gap:14px;padding:10px 14px;margin:0 12px;border:0;border-bottom:2px solid var(--line);background:none;width:calc(100% - 24px);text-align:left;font:inherit;color:inherit;cursor:pointer;min-height:76px}
.row:last-child{border-bottom:0}
.av{width:56px;height:56px;border-radius:50%;flex:none;background:var(--teal) center/cover;display:flex;align-items:center;justify-content:center}
.nm{font-size:20px}
.mid{flex:1;min-width:0}
.pv{color:var(--sub);font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st{background:var(--bub);border-radius:18px 18px 18px 4px;padding:8px 16px;font-size:15px;max-width:55%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.st:empty{display:none}
.cnt{background:var(--red);color:#fff;min-width:30px;height:30px;border-radius:15px;display:flex;align-items:center;justify-content:center;font-size:15px}
.add{width:56px;height:46px;border-radius:10px;border:3px solid var(--line);background:none;cursor:pointer;display:flex;align-items:center;justify-content:center}
.add:disabled{opacity:.4}
.empty{color:var(--sub);text-align:center;padding:60px 20px;font-size:17px}
.mail{padding:14px 26px;border-bottom:2px solid var(--line);cursor:pointer}
.mail b{font-weight:400;font-size:19px}.mail.un b::after{content:" ●";color:var(--red);font-size:12px}
.mail p{color:var(--sub);margin-top:6px;display:none;font-size:16px}.mail.open p{display:block}
#chat,#finChat{padding:12px 14px 20px}
.m{display:flex;gap:10px;padding-top:14px;align-items:flex-start}
.m.cont{padding-top:6px}
.m.cont .bb,.m.me.cont .bb{border-radius:16px}
.m.me{justify-content:flex-end}
.m .av{width:46px;height:46px}
.m .who{font-size:15px;margin-bottom:3px}
.bb{background:var(--bub);border-radius:4px 16px 16px 16px;padding:10px 16px;font-size:19px;word-break:break-word;max-width:100%}
.m.me .bb{background:var(--teal2);color:#fff;border-radius:16px 4px 16px 16px}
.m>div{max-width:72%}
form{display:flex;gap:10px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));flex:none}
form input{flex:1;min-width:0;height:48px;border:3px solid var(--line);border-radius:8px;padding:0 12px;font:inherit;font-size:18px;background:transparent;color:inherit}
form input:focus{outline:2px solid var(--teal);border-color:transparent}
form button{height:48px;padding:0 20px;border:0;border-radius:8px;background:var(--teal);color:#fff;font:inherit;font-size:19px;cursor:pointer}
#choices,#finChoices{display:flex;flex-direction:column;gap:8px;padding:10px 12px calc(12px + env(safe-area-inset-bottom));flex:none;border-top:2px solid var(--line)}#choices[hidden],#finChoices[hidden]{display:none}.ch{border:3px solid var(--teal);background:transparent;color:var(--txt);border-radius:12px;padding:12px 16px;font:inherit;font-size:19px;cursor:pointer;text-align:left}.ch:hover,.ch:focus-visible{background:var(--teal);color:#fff;outline:0}

.profile-overlay{position:fixed;inset:0;background:#0006;display:flex;align-items:center;justify-content:center;padding:18px;z-index:20}
.profile-overlay[hidden]{display:none}
.profile-modal{position:relative;background:#fff;color:#222;width:100%;max-width:360px;border-radius:34px;padding:28px 24px 24px;text-align:center;box-shadow:0 8px 32px #0002;max-height:calc(100dvh - 36px);overflow-y:auto}
.profile-close{position:absolute;right:18px;top:12px;border:0;background:none;color:#777;font-size:34px;cursor:pointer}
.profile-avatar{width:100px;height:100px;border-radius:50%;margin:18px auto 22px;background:#d8f7f5;display:flex;align-items:center;justify-content:center}
.profile-modal label{display:block;text-align:left;color:#777;font-size:13px;margin:12px 4px 5px}
.profile-modal input{width:100%;height:44px;border:2px solid #e5e5e5;border-radius:8px;padding:0 12px;font:inherit;font-size:17px;color:#222;background:#fff}
.profile-actions{display:flex;gap:10px;margin-top:22px}
.profile-actions button{flex:1;border:0;border-radius:9px;padding:12px 8px;font:inherit;font-size:16px;cursor:pointer}
.profile-cancel{background:#eee;color:#555}.profile-save{background:var(--teal);color:#fff}


.av-tools{display:flex;gap:8px;justify-content:center;margin:10px 0 2px}
.av-btn{border:2px solid #e5e5e5;background:#fff;color:#555;border-radius:8px;padding:8px 12px;font:inherit;font-size:15px;cursor:pointer}
.av-btn:focus-visible{outline:3px solid var(--teal)}
.profile-modal .av-url{display:flex;gap:8px}
.profile-modal .av-url input{flex:1;min-width:0;width:auto}
.av-url .av-btn{height:44px;flex:none}
.av-msg{min-height:20px;color:#d33;font-size:13px;text-align:left;margin:6px 4px 0}
.av-msg.ok{color:#2a9d8f}
.profile-modal input.sr{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none;border:0;padding:0}
#finOverlay{position:fixed;inset:0;z-index:30;display:flex;justify-content:center;background:#ddd}#finOverlay[hidden]{display:none}
#finOverlay[hidden]{display:none}
#finPanel{width:100%;max-width:480px;height:100dvh;background:#fff;display:flex;flex-direction:column;overflow:hidden}
#finPanel header{flex:none}
#finMain{flex:1;overflow-y:auto;overscroll-behavior:contain}
#finChat{min-height:100%;padding-bottom:24px}
#finDot{cursor:pointer;outline:0}
#finDot:focus-visible circle:last-child{stroke:#4ac9c4;stroke-width:1.5}
@media(prefers-color-scheme:dark){#finOverlay,#finPanel{background:#1f2327}}
#splash{position:fixed;inset:0;background:#4ac9c4;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;color:#fff;font:400 28px "Noto Sans KR","Malgun Gothic",sans-serif;transition:opacity .4s}#splash.out{opacity:0}
.fr .av.big{width:112px;height:112px;margin:24px auto 18px}
.fr h2{font-size:24px;font-weight:400;margin:0 0 6px}
.fr .fst{color:#888;min-height:44px;font-size:16px}
.fr hr{border:0;border-top:2px solid #e5e5e5;margin:14px 0 18px}
.fr .acts{display:flex;gap:10px}
.fr .acts button{flex:1;height:68px;border:2px solid #e5e5e5;border-radius:8px;background:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center}
.fr .acts button:focus-visible{outline:3px solid var(--teal)}
.profile-modal.fr{min-height:470px}.fr .gauge{margin:85px auto 0;display:block}.fr .dsc{color:#888;font-size:16px;white-space:pre-line}
.fr .ttl{font-size:21px;margin:26px 0 8px}
.dv{border-top:2px solid var(--line);margin:22px 0 4px;text-align:center}.dv span{display:block;padding-top:6px;color:var(--sub);font-size:14px}
#toast{
position:fixed;
left:50%;
top:calc(120px + env(safe-area-inset-top) + 12px);
bottom:auto;
transform:translateX(-50%);
max-width:88%;
width:max-content;
background:#000c;
color:#fff;
padding:10px 18px;
border-radius:22px;
font-size:16px;
text-align:center;
z-index:40;
opacity:0;
pointer-events:none;
box-sizing:border-box
}
</style>

<script>function showErr(m){const e=document.getElementById("main");if(e)e.innerHTML='<div style="padding:20px;color:#d33;font:16px sans-serif;white-space:pre-wrap;word-break:break-all"></div>',e.firstChild.textContent="⚠ 오류가 났어요. 이 글을 캡처해서 보내 주세요.\n\n"+m}
addEventListener("error",ev=>showErr(ev.message+" ("+String(ev.filename||"").split("/").pop()+":"+ev.lineno+")"));
const T0=Date.now();function hideSplash(){setTimeout(()=>{const s=document.getElementById("splash");if(!s)return;s.classList.add("out");setTimeout(()=>s.remove(),400)},Math.max(0,2000-(Date.now()-T0)))}</script>
<script src="data.js"></script>
<script>
(async () => {
if (!window.GAME_DATA) throw new Error("data.js를 읽지 못했어요. 파일 이름·위치 또는 문법 오류(쉼표, 따옴표)를 확인하세요.");
const D = window.GAME_DATA, KEY = "onhook_v" + D.version;
const loadErrs = [], scriptWarns = [];
await Promise.all([...D.characters, ...D.recommended].filter(c => c.scriptFile).map(async c => {
  try { const r = await fetch(c.scriptFile, { cache: "no-cache" }); if (!r.ok) throw new Error(r.status); c.script = parseScript(await r.text(), c.scriptFile); }
  catch (e) { loadErrs.push(c.scriptFile); console.warn("스크립트 로드 실패:", c.scriptFile, e); }
}));
const $ = s => document.querySelector(s);
const all = [...D.characters, ...D.recommended];
const byId = id => all.find(c => c.id === id);
const dupIds = all.map(c => c.id).filter((id, i, a) => a.indexOf(id) !== i);

/* ---------- TXT ---------- */
function parseScript(txt, file) {
  const nodes = {}, top = []; let cur = null, curId = null, topId = null, owner = null, mode = null, start = null, fin = null;
  const open = (id, isTop) => { const mv = []; if (isTop && cur && (/^(finish|finsih)/i.test(cur.top) === /^(finish|finsih)/i.test(id))) while (cur.lines.length && cur.lines[cur.lines.length - 1][0] === "line") mv.unshift(cur.lines.pop()); cur = nodes[id] = { lines: mv }; curId = id; mode = null; if (isTop) { top.push(id); topId = id; if (/^(finish|finsih)/i.test(id)) fin = fin || id; else start = start || id; } cur.top = topId; };
  for (const raw of txt.replace(/\r/g, "").split("\n")) {
    const l = raw.trim(); if (!l || l[0] === "#") continue;
    let m, x;
    if ((m = l.match(/^\[(.+)\]$/))) {
      const t = m[1].trim();
      if ((x = t.match(/^장면\s*[:：]?\s*(.+)$/))) open(x[1].trim(), true);
      else if (!cur) continue;
      else if (t === "선택지") { cur.choices = cur.choices || []; owner = curId; mode = "choice"; }
      else if ((x = t.match(/^(\d+)\s*번\s*선택$/))) open(owner + "_" + x[1], false);
      else if ((x = t.match(/^이동\s*[:：]?\s*(.+)$/))) cur.next = x[1].trim();
      else if (t === "끝") cur.end = true;
      else if ((x = t.match(/^호감도(?:\s+(.*))?$/))) { const sp = parseAff(x[1] || "", file, t); if (sp) cur.lines.push(["aff", sp]); }
      else if ((x = t.match(/^구분선\s*[:：]?\s*(.*)$/))) cur.lines.push(["line", x[1]]);
      continue;
    }
    if (!cur) open("start", true);
    if (mode === "choice" && (m = l.match(/^(\d+)\s*[.)]\s*(.+)$/))) { nodes[owner].choices.push({ text: m[2], next: owner + "_" + m[1] }); continue; }
    if ((m = l.match(/^([^:：]{1,20})[:：]\s*(.*)$/))) cur.lines.push([/^(주인공|나|me)$/i.test(m[1].trim()) ? "me" : "them", m[2]]);
    else if (cur.lines.length) cur.lines.push([cur.lines[cur.lines.length - 1][0], l]);
  }
  for (const id in nodes) {
    const n = nodes[id];
    if (n.choices && !n.choices.length) delete n.choices;
    if (!n.choices && !n.next && !n.end) {
      const i = top.indexOf(n.top);
      const isFinish = /^(finish|finsih)/i.test(n.top);
      const nx = top.slice(i + 1).find(t => /^(finish|finsih)/i.test(t) === isFinish);
      if (nx) n.next = nx;
    }
    (n.choices || []).forEach(c => { const b = nodes[c.next]; if ((b && b.lines[0] && b.lines[0][0] === "me") || /^\(.*\)$/.test(c.text.trim())) c.silent = true; });
  }
  return { start, fin, nodes };
}

/* 호감도 */
function parseAff(src, file, raw) {
  const sp = {}; let ok = false;
  for (const part of src.split("|").map(v => v.trim()).filter(Boolean)) {
    let m;
    if ((m = part.match(/^([+-])\s*(\d+)$/))) { sp.delta = (m[1] === "+" ? 1 : -1) * +m[2]; ok = true; }
    else if ((m = part.match(/^=\s*(\d+)$/))) { sp.set = +m[1]; ok = true; }
    else if ((m = part.match(/^제목\s+(.+)$/))) { sp.title = m[1]; ok = true; }
    else if ((m = part.match(/^설명\s+(.+)$/))) { sp.desc = m[1].replace(/\\n/g, "\n"); ok = true; }
    else if ((m = part.match(/^색\s+(#[0-9a-fA-F]{3,8})$/))) { sp.color = m[1]; ok = true; }
    else if (part === "반복") sp.repeat = true;
    else scriptWarns.push((file || "") + " → [" + raw + "]  ('" + part + "'을(를) 해석하지 못했어요)");
  }
  if (!ok && !scriptWarns.some(w => w.includes("[" + raw + "]"))) scriptWarns.push((file || "") + " → [" + raw + "]  (바꿀 내용이 없어요. +숫자, -숫자, =숫자, 제목, 설명, 색 중 하나는 필요해요)");
  return ok ? sp : null;
}

/* ---------- 저장 상태 ---------- */
let S = null;
try { S = JSON.parse(localStorage.getItem(KEY)); } catch (e) {}
if (!S) { S = { added: [], chats: {}, unread: {}, pos: {}, aff: {}, affDone: {}, clear: {}, mail: D.mail.map(m => !!m.read), me: { ...D.me } }; D.characters.forEach(ensure); }
if (!S.me) S.me = { ...D.me };
if (!S.aff) S.aff = {};        
if (!S.affDone) S.affDone = {};
if (!S.clear) S.clear = {};

D.characters.concat(D.recommended.filter(r => S.added.includes(r.id))).forEach(c => {
  if (!S.chats[c.id] || !S.pos[c.id]) { ensure(c); save(); }  
  const n = c.script && c.script.nodes[c.script.start], p = S.pos[c.id];
  if (!n || (p && p.node && c.script.nodes[p.node])) return;
  S.pos[c.id] = { node: c.script.start, k: 0 };
  if (!(S.chats[c.id] || []).length) S.unread[c.id] = lead(n);
  save();
});
function ensure(c) {
  if (S.aff) delete S.aff[c.id];
  if (S.clear) delete S.clear[c.id];
  if (S.affDone) Object.keys(S.affDone).forEach(k => { if (k.startsWith(c.id + "/")) delete S.affDone[k]; });
  const sc = c.script, n = sc && sc.nodes[sc.start];
  S.chats[c.id] = (c.history || []).map(x => x.slice());
  S.pos[c.id] = { node: sc && sc.start, k: 0 };
  S.unread[c.id] = c.unread != null ? c.unread : n ? lead(n) : 0;
}
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); return true; } catch (e) { return false; } }

/* ---------- 호감도 ---------- */
const clamp = v => Math.max(0, Math.min(100, Math.round(+v) || 0));
const safeColor = v => /^#[0-9a-f]{3,8}$/i.test(String(v)) ? v : "#55c4b4";
function affOf(c) {
  const st = (S.aff && S.aff[c.id]) || {};
  const base = Object.assign({ level: 25, title: "", color: "#55c4b4", dot: false }, D.affinityDefault, c.affinity);
  const lv = clamp(st.level != null ? st.level : base.level);
  const stage = (base.stages || []).filter(g => (g.from || 0) <= lv).sort((x, y) => (y.from || 0) - (x.from || 0))[0];
  const a = Object.assign({}, base, stage || {}, { level: lv });
  ["title", "desc", "color"].forEach(k => { if (st[k] != null) a[k] = st[k]; });
  a.color = safeColor(a.color);
  return a;
}
const TOAST_AFF = "{이름}님은 {주인공이름}님을 [{호감도}]라고 생각하고 있습니다.";
const TOAST_CLEAR = "[{이름}]의 공략이 완료 되었습니다.";
let toastQueue = [], toastBusy = false;
function toast(msg) {
  toastQueue.push(msg);
  if (!toastBusy) nextToast();
}
function nextToast() {
  const msg = toastQueue.shift();
  if (msg == null) { toastBusy = false; return; }
  toastBusy = true;
  let t = document.getElementById("toast");
  if (!t) { t = document.createElement("div"); t.id = "toast"; t.setAttribute("role", "status"); t.setAttribute("aria-live", "polite"); document.body.append(t); }
  t.textContent = msg; t.classList.add("on");
  setTimeout(() => { t.classList.remove("on"); setTimeout(nextToast, 350); }, 2600);
}
function toastText(template, c) {
  const a = affOf(c);
  return String(template)
    .replace(/\{이름\}/g, c.name)
    .replace(/\{호감도\}/g, a.title || "")
    .replace(/\{주인공이름\}/g, (S.me && S.me.name) || D.me.name || "주인공");
}
function applyAff(c, sp, key) {
  if (!sp.repeat) { if (S.affDone[key]) return; S.affDone[key] = 1; }
  const before = affOf(c).level;
  const st = S.aff[c.id] = S.aff[c.id] || {};
  let lv = sp.set != null ? sp.set : before;

const running = {};
const nodeOf = c => c.script && c.script.nodes[S.pos[c.id].node];

function push(c, who, text) {
  const prev = (S.chats[c.id] || []).slice(-1)[0];
  (S.chats[c.id] = S.chats[c.id] || []).push([who, text]);
  if (who === "them" && !(room && room.id === c.id)) S.unread[c.id] = (S.unread[c.id] || 0) + 1;
  save();
  if (room && room.id === c.id) { $("#chat").append(bubble(c, [who, text], prev)); $("#main").scrollTop = $("#main").scrollHeight; }
}
function play(c) {
  const p = S.pos[c.id], n = nodeOf(c);

  const steps = stepsOf(n); running[c.id] = true;
  const WAIT = D.dividerWait != null ? D.dividerWait : 5000;   /* 구분선 뒤 대기(ms) */
  const finish = () => { running[c.id] = false; if (n.choices) showChoices(); else if (n.next) go(c, n.next); };
  (function step() {
    let prev; for (let i = p.k - 1; i >= 0; i--) if (steps[i][0] !== "aff") { prev = steps[i]; break; }   /* 호감도 줄은 대기 시간 계산에서 제외 */
    if (p.k < steps.length) {
      const cur = steps[p.k], isAff = cur[0] === "aff", d = isAff ? 0 : prev && prev[0] === "line" ? WAIT : cur[0] === "me" ? 900 : cur[0] === "line" ? 400 : 800;
      setTimeout(() => { if (isAff) applyAff(c, cur[1], c.id + "/" + p.node + "/" + p.k); else push(c, cur[0], cur[1]); p.k++; save(); step(); }, d);
    } else if (prev && prev[0] === "line") setTimeout(finish, WAIT);
    else finish();
  })();
}

let finishSession = null;
function openFinish(c) {
  if (!c.script || !c.script.fin || !S.clear[c.id]) return;
  const session = finishSession = { c, last: null };
  $("#finTitle").textContent = c.name + " · 공략 완료";
  $("#finBack").hidden = true;
  $("#finChat").innerHTML = "";
  $("#finChoices").innerHTML = "";

  playFinishNode(session, c.script.fin);

function finishBubble(session, line) {
  const chat = $("#finChat");
  chat.append(bubble(session.c, line, session.last));
  session.last = line;
  $("#finMain").scrollTop = $("#finMain").scrollHeight;
}
function playFinishNode(session, id) {
  if (finishSession !== session) return;
  const node = session.c.script.nodes[id];
  if (!node) return finishDone(session);
  const lines = (node.lines || []).filter(line => line[0] !== "aff");
  const wait = D.dividerWait != null ? D.dividerWait : 5000;
  let k = 0;
  const next = () => {
    if (finishSession !== session) return;
    if (node.choices) showFinishChoices(session, node);
    else if (node.next) playFinishNode(session, node.next);
    else finishDone(session);
  };
  const step = () => {
    if (finishSession !== session) return;
    const prev = lines[k - 1];
    if (k < lines.length) {
      const line = lines[k];
      const delay = prev && prev[0] === "line" ? wait : line[0] === "me" ? 900 : line[0] === "line" ? 400 : 800;
      setTimeout(() => { if (finishSession !== session) return; finishBubble(session, line); k++; step(); }, delay);
    } else if (prev && prev[0] === "line") setTimeout(next, wait);
    else next();
  };
  step();
}

    const btn = el("button", "ch", choice.text);

      box.hidden = true;
      if (!choice.silent) finishBubble(session, ["me", choice.say || choice.text]);
      playFinishNode(session, choice.next);

    box.append(btn);

  box.hidden = false;
  $("#finMain").scrollTop = $("#finMain").scrollHeight;

function finishDone(session) {

  $("#finBack").hidden = false;

  box.hidden = false;
  $("#finMain").scrollTop = $("#finMain").scrollHeight;
}

function fileToAvatar(file) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      URL.revokeObjectURL(url);
      try {
        const w = img.naturalWidth, h = img.naturalHeight, side = Math.min(w, h);
        if (!side) return reject(new Error("invalid image"));
        const canvas = document.createElement("canvas"); canvas.width = canvas.height = 256;
        canvas.getContext("2d").drawImage(img, (w-side)/2, (h-side)/2, side, side, 0, 0, 256, 256);
        resolve(canvas.toDataURL("image/jpeg", 0.88));
      } catch (error) { reject(error); }
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("image load failed")); };
    img.src = url;
  });
}

};
$("#avPick").onclick = () => $("#avFile").click();
$("#avFile").onchange = async e => {
  const file = e.target.files && e.target.files[0]; e.target.value = "";
  if (!file) return;
  if (!/^image\/(png|jpe?g|webp|gif)$/.test(file.type)) return avatarMessage("PNG, JPG, WEBP, GIF 이미지만 올릴 수 있어요.");
  if (file.size > 15 * 1024 * 1024) return avatarMessage("파일이 너무 커요. 15MB 이하로 올려 주세요.");
  const token = ++avatarToken;
  try {
    const value = await fileToAvatar(file);
    if (token !== avatarToken) return;
    pendingAvatar = value; previewAvatar(value); $("#profileAvatarUrl").value = "";
    avatarMessage("미리보기에 적용했어요. 저장을 눌러야 반영돼요.", true);
  } catch (error) { if (token === avatarToken) avatarMessage("이미지를 읽지 못했어요. 다른 파일로 시도해 주세요."); }
};
$("#avReset").onclick = () => {
  avatarToken++; pendingAvatar = D.me.avatar || "";
  previewAvatar(pendingAvatar); $("#profileAvatarUrl").value = "";
  avatarMessage("기본 이미지로 바꿨어요. 저장을 눌러야 반영돼요.", true);
};
function applyAvatarUrl() {
  const raw = $("#profileAvatarUrl").value.trim();
  if (!raw) return avatarMessage("이미지 링크를 붙여넣어 주세요.");
  const value = /^https:\/\//i.test(raw) ? safeImg(raw) : "";
  if (!value) return avatarMessage("https:// 로 시작하는 공개 이미지 주소를 입력해 주세요.");
  const token = ++avatarToken;
  avatarMessage("이미지를 확인하고 있어요.", true);
  const image = new Image(); image.referrerPolicy = "no-referrer";
  image.onload = () => {
    if (token !== avatarToken) return;
    pendingAvatar = value; previewAvatar(value);
    avatarMessage("미리보기에 적용했어요. 저장을 눌러야 반영돼요. 원본 링크가 삭제되면 사진도 보이지 않을 수 있어요.", true);
  };
  image.onerror = () => { if (token === avatarToken) avatarMessage("이미지를 불러오지 못했어요. 웹페이지 주소가 아닌 이미지 파일 주소인지 확인해 주세요."); };
  image.src = value;
}
$("#avUrlGo").onclick = applyAvatarUrl;
$("#profileAvatarUrl").addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); applyAvatarUrl(); } });
$("#profileStatus").addEventListener("keydown", e => { if (e.key === "Enter") $("#profileSave").click(); });
addEventListener("keydown", e => {
  if (e.key !== "Escape") return;
  if (!$("#finOverlay").hidden) { if (!$("#finBack").hidden) closeFinish(); return; }
  closeFriend();
  if (!$("#profileOverlay").hidden) closeProfileEditor();
});
addEventListener("popstate", () => room && closeRoom());
render();
})().catch(e => { console.error(e); showErr(e && e.message || e); }).finally(hideSplash);
</script>
</body>
</html>
